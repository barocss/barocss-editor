name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and verification tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release metadata and versioning tests
        run: pnpm test:release

      - name: Local verification tools
        run: pnpm test:checks

      - name: Lint
        run: pnpm lint

  typecheck-source:
    name: Source type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check

  typecheck-tests:
    name: Test type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # The tests as well, held to a per-package count (`typecheck-budgets.json`).
      # `pnpm type-check` reads each package's `src` only, because that config is the
      # build's — so for a long time a test could name a field that does not exist and
      # pass. Fails when a count grows *and* when it shrinks without the number coming
      # down: a budget above the truth leaves room to break that much again quietly.
      - name: Type check the tests
        run: pnpm type-check:tests

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test

  lint-typecheck-test:
    # Preserve the required check name configured in branch protection.
    name: Lint, type-check, unit test
    needs: [lint, typecheck-source, typecheck-tests, unit-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SOURCE_RESULT: ${{ needs.typecheck-source.result }}
          TEST_TYPES_RESULT: ${{ needs.typecheck-tests.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
        run: |
          for check in LINT_RESULT SOURCE_RESULT TEST_TYPES_RESULT UNIT_RESULT; do
            result="${!check}"
            echo "$check: $result"
            if [[ "$result" != "success" ]]; then
              echo "Required verification did not succeed: $check"
              exit 1
            fi
          done

  e2e-react:
    name: E2E (editor-react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (React)
        run: pnpm test:e2e:react
        env:
          CI: true

      - name: Keep failed React browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-browser-failure
          path: apps/editor-react/test-results/
          if-no-files-found: ignore
          retention-days: 7

  npm-consumers:
    name: Npm package consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:npm
      - run: pnpm release:npm:check
      - name: Check README and integration examples against packaged APIs
        run: pnpm docs:examples
      - name: Keep package verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-consumers-${{ github.sha }}
          path: output/npm/
          if-no-files-found: ignore
          retention-days: 7

  e2e-note-scenarios:
    name: E2E (Note editing scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Note editing scenarios
        run: pnpm test:e2e:note:scenarios
        env:
          CI: true

      - name: Keep Note scenario report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: note-scenario-results
          path: |
            apps/note/test-results/scenarios/
            apps/note/playwright-report/scenarios/
          if-no-files-found: warn
          retention-days: 7
