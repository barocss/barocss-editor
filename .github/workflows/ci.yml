name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, type-check, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # The tests as well, held to a per-package count (`typecheck-budgets.json`).
      # `pnpm type-check` reads each package's `src` only, because that config is the
      # build's — so for a long time a test could name a field that does not exist and
      # pass. Fails when a count grows *and* when it shrinks without the number coming
      # down: a budget above the truth leaves room to break that much again quietly.
      - name: Type check the tests
        run: pnpm type-check:tests

      - name: Unit tests
        run: pnpm test

  e2e-react:
    name: E2E (editor-react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (React)
        run: pnpm test:e2e:react
        env:
          CI: true
