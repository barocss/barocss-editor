name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, type-check, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release metadata and versioning tests
        run: pnpm test:release

      - name: Local verification tools
        run: pnpm test:checks

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # The tests as well, held to a per-package count (`typecheck-budgets.json`).
      # `pnpm type-check` reads each package's `src` only, because that config is the
      # build's — so for a long time a test could name a field that does not exist and
      # pass. Fails when a count grows *and* when it shrinks without the number coming
      # down: a budget above the truth leaves room to break that much again quietly.
      - name: Type check the tests
        run: pnpm type-check:tests

      - name: Unit tests
        run: pnpm test

  e2e-react:
    name: E2E (editor-react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (React)
        run: pnpm test:e2e:react
        env:
          CI: true

      - name: Keep failed React browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-browser-failure
          path: apps/editor-react/test-results/
          if-no-files-found: ignore
          retention-days: 7

  npm-consumers:
    name: Npm package consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:npm
      - run: pnpm release:npm:check
      - name: Keep package verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-consumers-${{ github.sha }}
          path: output/npm/
          if-no-files-found: ignore
          retention-days: 7
