<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>공식 한 칸</title>
    <meta name="description" content="빈칸을 채우며 익히는 공식" />
    <style>
      .boot-screen {
        min-height: 85svh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #191f28;
        text-align: center;
        box-sizing: border-box;
      }
      .boot-symbol {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #3182f6;
        color: white;
        font:
          italic 32px Georgia,
          serif;
        margin-bottom: 18px;
      }
      .boot-screen h1 {
        font-size: 22px;
        margin: 6px 0;
      }
      .boot-screen p {
        font-size: 14px;
        color: #6b7684;
        line-height: 1.7;
      }
      .boot-screen button {
        padding: 14px 20px;
        background: #3182f6;
        color: white;
        border: 0;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section class="boot-screen" role="status" aria-live="polite">
        <span class="boot-symbol" aria-hidden="true">ƒ</span>
        <h1>공식 한 칸</h1>
        <p>빈칸을 채우며 익히는 공식</p>
      </section>
    </div>
    <noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
