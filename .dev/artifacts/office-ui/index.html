<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wonffice · 제품 UI 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#202329;font:14px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid #e0e2e5;padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}strong{font-size:18px;letter-spacing:-.6px}h1{font-size:14px;font-weight:500;margin:0;color:#626875}nav{display:flex;gap:4px;margin-left:auto}button,select{font:inherit;border:1px solid #dce0e5;background:white;padding:6px 12px;border-radius:5px;color:inherit;cursor:pointer}button[aria-pressed=true]{color:#245bea;background:#eaf0ff;border-color:#a9bffc}main{padding:24px}.summary{display:flex;gap:24px;margin:0 0 22px;color:#626875;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0;min-width:0;background:white;border:1px solid #e0e2e5;border-radius:6px;overflow:hidden}figcaption{padding:10px 14px;border-bottom:1px solid #e0e2e5;font-weight:600;display:flex;justify-content:space-between}figcaption span{font-size:12px;color:#727985;font-weight:400}img{width:100%;height:auto;display:block}a{color:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}.pair h2{grid-column:1/-1;font-size:14px;margin:0}footer{color:#727985;padding:0 24px 24px;font-size:12px}@media(max-width:850px){.grid,.pair{grid-template-columns:1fr}.summary{flex-wrap:wrap;gap:8px}header{gap:10px}nav{margin:0}}
</style>
<header><strong>wonffice</strong><h1>실제 제품 화면 · 공통 구조 비교</h1><a href="/design-system/index.html">디자인 시스템</a><nav aria-label="비교 방식"><button data-mode="detail" aria-pressed="true">제품별 크게 보기</button><button data-mode="after" aria-pressed="false">현재 4개 제품</button><button data-mode="compare" aria-pressed="false">수정 전 / 후</button></nav><select aria-label="제품" id="product"><option>Note</option><option>Word</option><option selected>Slides</option><option>Site</option></select><select aria-label="화면 크기" id="size"><option value="">1440 × 960</option><option value="-compact">1024 × 768</option><option value="-dark">어두운 테마 · 현재</option></select></header>
<main><p class="summary"><span>공통 헤더 52px / 기본 도구 44px</span><span>버튼 30px / 아이콘 16px</span><span>속성 패널 280px</span><span>코발트 선택 상태 / 중립 배경</span></p><div id="screens"></div></main><footer>동일한 테스트 문서와 화면 크기로 캡처한 실제 편집기입니다. 이미지를 누르면 원본 크기로 볼 수 있습니다. 문서 내용과 렌더러는 제품별로 유지합니다.</footer>
<script>
let mode='detail';const products=['Note','Word','Slides','Site'];const screens=document.querySelector('#screens');
function frame(product,version,suffix){return `<figure><figcaption>${product}<span>${version!=='after'?'수정 전':'현재'}</span></figcaption><a href="${version}/${product.toLowerCase()}${suffix}.png?v=buttons-20260914" target="_blank"><img src="${version}/${product.toLowerCase()}${suffix}.png?v=buttons-20260914" alt="${product} ${version!=='after'?'수정 전':'현재'} 실제 편집 화면"></a></figure>`}
function render(){const suffix=document.querySelector('#size').value;const compare=mode==='compare'&&suffix!=='-dark';screens.className=compare||mode==='detail'?'':'grid';screens.innerHTML=(mode==='detail'?[document.querySelector('#product').value]:products).map(p=>compare?`<section class="pair"><h2>${p}</h2>${frame(p,'before-compact',suffix)}${frame(p,'after',suffix)}</section>`:frame(p,'after',suffix)).join('')}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.querySelector('#size').onchange=render;document.querySelector('#product').onchange=render;render();
</script></html>
